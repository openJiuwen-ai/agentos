name: agentos-manager

networks:
  agentos:
    name: agentos
    driver: bridge
  # image-process ↔ agentos only; no host publish, no route to other services / internet
  image-build:
    name: agentos-image-build
    driver: bridge
    internal: true

services:
  # =========================================================================
  # AgentOS Control Panel — frontend + backend + nginx (single container)
  # =========================================================================
  agentos:
    image: agentos-control-panel:latest
    ports: ["${FRONTEND_PORT:-8090}:80"]
    environment:
      # ── Database (auto-constructed from POSTGRES_*) ──
      AGENTOS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agentos
      AGENTOS_JWT_SECRET_KEY: ${AGENTOS_JWT_SECRET_KEY}
      AGENTOS_ADMIN_USERNAME: ${AGENTOS_ADMIN_USERNAME}
      AGENTOS_ADMIN_PASSWORD: ${AGENTOS_ADMIN_PASSWORD}
      LITELLM_ADMIN_URL: http://${LITELLM_HOST:-localhost}:${LITELLM_PORT:-8100}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_KEY_ENCRYPTION_KEY: ${LITELLM_KEY_ENCRYPTION_KEY}
      LITELLM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      AGENTOS_HOME_BASE: /home/agentos/users
      LOG_DIR: /home/agentos/logs
      AGENTOS_SWARM_TEMPLATE_DIR: ${AGENTOS_SWARM_TEMPLATE_DIR:-/home/agentos/host_root/.jiuwenswarm}
      AGENTOS_SYS_UID: ${AGENTOS_SYS_UID:-1000}
      AGENTOS_SYS_GID: ${AGENTOS_SYS_GID:-1000}
      IMAGE_PROCESS_URL: http://image-process:8091
      # ── Hardware monitoring ──
      NODE_EXPORTER_HOST: ${NODE_EXPORTER_HOST:-host.docker.internal}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-8091}
      NPU_EXPORTER_HOST: ${NPU_EXPORTER_HOST:-host.docker.internal}
      NPU_EXPORTER_PORT: ${NPU_EXPORTER_PORT:-8092}
      NODE_SERVICE_HOST: ${NODE_SERVICE_HOST:-host.docker.internal}
      NODE_SERVICE_PORT: ${NODE_SERVICE_PORT:-8101}
      WORKER_NODES: ${WORKER_NODES:-}
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      AGENTOS_NODE_ROLE: ${AGENTOS_NODE_ROLE:-master}
      AGENT_REGISTER_URL: ${AGENT_REGISTER_URL}
      INITIAL_MODELS: ${INITIAL_MODELS}
      INITIAL_MODEL_API_BASE: ${INITIAL_MODEL_API_BASE}
      INITIAL_MODEL_API_KEY: ${INITIAL_MODEL_API_KEY}
      INITIAL_MODEL_METRICS_URL: ${INITIAL_MODEL_METRICS_URL}
      INITIAL_INFERENCE_ENGINE: ${INITIAL_INFERENCE_ENGINE}
      # ── OAuth2 Provider ──
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}
      OAUTH2_ACCESS_TOKEN_EXPIRE_MINUTES: ${OAUTH2_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      OAUTH2_FRONTEND_ORIGIN: ${OAUTH2_FRONTEND_ORIGIN:-http://localhost:80}
      OAUTH2_CLIENT_NAME: ${OAUTH2_CLIENT_NAME}
      # ── Preset Skills (for user skill preinstall) ──
      AGENTOS_PRESET_SKILLS_DIR: ${AGENTOS_PRESET_SKILLS_DIR:-}
      # ── SkillHub 市场（URL 由 SKILLHUB_HOST + 默认端口拼装；SKILLHUB_HOST 为空回退 host.docker.internal）──
      SKILLHUB_BASE_URL: http://${SKILLHUB_HOST:-host.docker.internal}:${SKILLHUB_FRONTEND_PORT:-8098}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/agentos.conf:ro
      # agentos 不再挂 docker.sock；构建由 image-process 服务负责
      - ./victoriametrics/agent-metrics.json:/etc/vm/agent-metrics.json
      - ./exports:/var/log/agentos_exports
      - ${AGENTOS_BASE:-/home/agentos}/users:/home/agentos/users
      - ${AGENTOS_BASE:-/home/agentos}/logs:/home/agentos/logs
      - ${JIUWENBOX_LOG_DIR:-/tmp/jiuwenbox}:/tmp/jiuwenbox:ro
      - /root:/home/agentos/host_root:ro
      - /var/log/agentos:/var/log/agentos
      # 预装 skill 源目录（--with-skillhub 时由 deploy.sh 写入 .env）
      # 未配置时挂 /dev/null（文件）→ 容器内 Path.is_dir() 为 False → backend _preset_skills 自动跳过，安全
      - ${AGENTOS_PRESET_SKILLS_DIR:-/dev/null}:${AGENTOS_PRESET_SKILLS_DIR:-/dev/null}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentos
      - image-build
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      image-process:
        condition: service_started
      victoriametrics:
        condition: service_started
    restart: unless-stopped

  # =========================================================================
  # image_process — 三方 Agent OCI 构建服务；仅 image-build 内网可达，不对宿主暴露端口
  # =========================================================================
  image-process:
    image: agentos-image-process:latest
    environment:
      - AGENTOS_SYS_UID=${AGENTOS_SYS_UID:-1000}
      - AGENTOS_SYS_GID=${AGENTOS_SYS_GID:-1000}
    volumes:
      - /run/docker.sock:/run/docker.sock
      - ${AGENTOS_BASE:-/home/agentos}/users:${AGENTOS_BASE:-/home/agentos}/users
    networks:
      - image-build
    restart: unless-stopped

  # =========================================================================
  # PostgreSQL — shared by AgentOS & LiteLLM
  # =========================================================================
  postgres:
    image: postgres:18.0
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/ensure-agentos-db.sh:/usr/local/bin/ensure-agentos-db.sh:ro
    entrypoint: ["bash", "/usr/local/bin/ensure-agentos-db.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agentos
    restart: unless-stopped

  # =========================================================================
  # LiteLLM Proxy
  # =========================================================================
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.91.1
    ports: ["${LITELLM_PORT:-8100}:4000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      DISABLE_ADMIN_UI: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config=/app/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentos
    restart: unless-stopped

  # =========================================================================
  # VictoriaMetrics — scrape targets from agent-metrics.json
  # =========================================================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.135.0
    ports: ["127.0.0.1:${VICTORIAMETRICS_PORT:-8428}:8428"]
    volumes:
      - vm-data:/victoria-metrics-data
      - ./victoriametrics:/etc/vm:ro
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.fileSDCheckInterval=30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentos
    restart: unless-stopped

  # =========================================================================
  # Grafana Loki (Simple Scalable, 单节点 all target)
  # =========================================================================
  loki:
    image: grafana/loki:3.6.0
    user: "0:0"
    ports: ["8096:8096"]
    command:
      - -target=all
      - -config.file=/etc/loki/config.yaml
    volumes:
      - loki-data:/var/loki
      - loki-wal:/var/loki-wal
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
    networks:
      - agentos
    restart: unless-stopped

  # =========================================================================
  # Alloy — 日志采集 agent
  # =========================================================================
  alloy:
    image: grafana/alloy:v1.18.1
    volumes:
      - ${AGENTOS_BASE:-/home/agentos}/users:/home/agentos/users:ro
      - ${AGENTOS_BASE:-/home/agentos}/logs:/home/agentos/logs:ro
      - /var/log/agentos:/var/log/agentos:ro
      - ${JIUWENBOX_LOG_DIR:-/tmp/jiuwenbox}:/tmp/jiuwenbox:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/etc/alloy/data
    ports: ["127.0.0.1:12345:12345"]
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/etc/alloy/data /etc/alloy/config.alloy
    networks:
      - agentos
    restart: unless-stopped

  # =========================================================================
  # Grafana — dashboards
  # =========================================================================
  grafana:
    image: grafana/grafana:12.4.2
    depends_on: [victoriametrics]
    ports: ["${GRAFANA_PORT:-8093}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"
      GF_SERVER_ROOT_URL: "http://localhost:${FRONTEND_PORT:-8090}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/victoriametrics.yml:/etc/grafana/provisioning/datasources/victoriametrics.yml:ro
      - ./grafana/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./grafana/default.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./grafana/vllm-perf.json:/var/lib/grafana/dashboards/vllm-perf.json:ro
      - ./grafana/sglang-perf.json:/var/lib/grafana/dashboards/sglang-perf.json:ro
      - ./grafana/log-explore.json:/var/lib/grafana/dashboards/log-explore.json:ro
    networks:
      - agentos
    restart: unless-stopped

volumes:
  postgres-data:
  vm-data:
  grafana-data:
  loki-data:
  loki-wal:
  alloy_data:
