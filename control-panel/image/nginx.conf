server {
    listen 80;
    server_name localhost;

    # Security: suppress nginx version in error pages and Server header
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent upload — large file support (500 MB)
    location /api/v1/thirdparty_agent/installers {
        proxy_pass http://127.0.0.1:8000/api/v1/thirdparty_agent/installers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
    }

    # Health check proxy
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
