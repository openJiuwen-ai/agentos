[project]
name = "agentos-control-panel-backend"
version = "0.1.0"
description = "AgentOS Control Panel backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
