# MooseFS 分布式存储配置文件
# 模式选择说明：
#   --hosts 指定 2+ IP → SSH 多机模式（Master 取第一个 IP）
#   无 --hosts → systemd 模式（本机独立部署，从 config.yaml 获取 master IP）
#   默认部署分布式文件系统，可通过 MOOSEFS_ENABLED=no 关闭

# Master 节点地址（systemd 模式下区分 master/agent 角色）
# 默认从 deploy/config.yaml 的 master_nodes 第一个 IP 获取
# SSH 多机模式下自动取 --hosts 第一个 IP，此配置被覆盖
MOOSEFS_MASTER_HOST=""

# 是否启用 MooseFS（auto/yes/no）
# auto/yes: 默认部署分布式文件系统
# no:       关闭分布式文件系统（使用本地文件系统）
MOOSEFS_ENABLED="auto"

# 是否使用 systemd（auto/yes/no）
# auto: 自动检测（command -v systemctl + /run/systemd/system）
# yes:  强制使用（不可用则报错）
# no:   强制禁用（使用直接脚本执行）
MOOSEFS_USE_SYSTEMD="auto"

# Master 服务端口
MFS_MASTER_PORT=9420

# Chunkserver 端口（master 监听 chunkserver 的端口）
MFS_CHUNK_PORT=9422

# Client (mfsmount) 端口
MFS_CLIENT_PORT=9421

# Chunkserver 数据目录
MFS_CHUNK_DIR="/data/mfschunks"

# 共享挂载点路径
MFS_MOUNT_POINT="/home/agentos/users"

# 元数据缓存开关（yes/no）
# yes: 开启 FUSE 元数据缓存，大幅减少路径查找/目录枚举对 mfsmaster 的请求量
#      适用于几百用户并发、日志采集 tail 大量文件的场景
#      跨节点新建文件可见性延迟 ≤0.5s，数据读写正确性不受影响（close-to-open 语义保证）
# no:  关闭缓存，每次元数据操作都打到 master（适合对文件可见性实时性要求极高的场景）
MFS_META_CACHE="yes"

# ---- 以下为 mfsmount 性能调优参数 ----
# 空值表示使用 MooseFS 默认值，不写入挂载选项

# fsync 最小间隔时间（秒）
# 默认 0（每次 close 都 fsync），设为 5 表示只有打开超过 5 秒的文件 close 时才强制 fsync
# 小文件频繁 create/write 时，默认行为是最大瓶颈；设为 5 可大幅提升写吞吐
# 风险：进程异常退出时最多丢失最近 N 秒的写入数据（master 仍保有元数据，数据在 chunkserver 写缓存中）
# 设为 0 恢复默认的每次 close fsync 行为
MFS_FSYNC_MIN_TIME="5"

# 写缓存大小（MiB）
# 默认 256，增大可批量合并小文件写入，减少 chunkserver 往返
# 建议写密集场景设为 512~1024
MFS_WRITE_CACHE_SIZE="512"

# FUSE 空闲工作线程上限
# 默认自动，高并发（几百用户）时设为 64~128 可减少线程创建开销
MFS_MAX_IDLE_THREADS="64"

# 数据副本数（多机默认 2，单机自动设为 1）
MFS_GOAL=2

# uninstall 时是否彻底清理数据（yes/no）
# no:  保留 chunkserver 数据和 master 元数据，uninstall 后重新 install+up 可恢复之前数据（默认）
# yes: 彻底清理所有数据，不可恢复
MOOSEFS_PURGE_DATA="no"
