# AgentOS 集群配置文件（默认单机开发模式）
#
# 此配置随 deploy 目录一起持久化到 ~/.agentos/deploy/config.yaml
# ansible 部署时会修改此文件后再执行 install
#
# 配置格式说明：
#   etcd_nodes: etcd 集群节点列表（单机 1 节点 / 4 机 HA 3 节点）
#   master_nodes: master 节点列表（单机 1 节点 / 4 机 HA 2 节点）
#   ingress_virtual_ip: 统一入口虚拟 IP，抢占到 VIP 的节点部署 gateway/registry/web-server

cluster:
  # etcd 集群节点（奇数节点保证 raft 共识）
  etcd_nodes:
    - "127.0.0.1"

  # master 节点（主备）
  # 多机 HA 时配置 2 个节点: 第一个为默认 MASTER（keepalived priority 最高），
  # 其余为 BACKUP；管理面服务仅在 VIP 持有节点上运行（keepalived notify 驱动切换）
  master_nodes:
    - "127.0.0.1"

  # 统一入口虚拟 IP（抢占成功后启动 gateway/registry/web-server）
  # 多机 HA 时由 keepalived VRRP 在 master_nodes 间竞争持有；
  # 单机/回环 VIP 时 keepalived 模块自动跳过
  ingress_virtual_ip: "127.0.0.1"
