# AgentOS TUI Launcher 构建配置
# 该文件描述 agentos-tui-launcher 这个 Python 发行包的元数据与依赖。
# 设计文档：tui-switch-cc-design.md；公共契约：tui-switch-cc-public-contract.md

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-tui-launcher"
version = "0.1.0"
description = "AgentOS 顶层 TUI 启动器：负责登录、会话恢复与 JiuwenSwarm / cc-tui 切换"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentOS Team" }
]
# 依赖说明：
# - requests：跨平台 HTTP 客户端，用于调用 IAM 接口
# - keyring：跨平台安全凭据存储（Windows Credential Manager / macOS Keychain / Linux Secret Service）
# - websockets：gateway WebSocket 客户端，用于 3rdagent.switch 调用
# - paramiko：SSH 隧道客户端，用于连接三方 Agentos 远程终端
dependencies = [
    "requests>=2.28",
    "keyring>=24",
    "websockets<16,>=12.0",
    "paramiko>=3.0",
]

[project.optional-dependencies]
# 开发与测试时使用，不参与发布
dev = [
    "pytest>=7",
    "pytest-mock>=3",
]

[project.scripts]
# 安装后会在 PATH 中生成 agentos-tui 命令
agentos-tui = "agentos_tui_launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentos_tui_launcher = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
